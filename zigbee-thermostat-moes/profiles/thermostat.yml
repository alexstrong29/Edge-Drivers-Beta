name: thermostat
components:
  - id: main
    capabilities:
      - id: thermostatMode
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Thermostat
metadata:
  deviceType: Thermostat
  ocfDeviceType: oic.d.thermostat
  deviceTypeId: Thermostat
  mnmn: SmartThings
  vid: generic-thermostat
preferences:
  - name: "temperatureScale"
    title: "Temperature Scale"
    description: "Display temperature in Celsius or Fahrenheit"
    required: false
    preferenceType: enumeration
    definition:
      options:
        C: "Celsius (°C)"
        F: "Fahrenheit (°F)"
      default: "C"
