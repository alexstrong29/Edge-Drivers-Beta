name: moes-thermostat
components:
  - id: main
    capabilities:
      - id: thermostatMode
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
        config:
          values:
            - key: heatingSetpoint.value
              range: [5, 35]
              step: 0.5
      - id: temperatureMeasurement
        version: 1
      - id: dreamspace09858.moesEcoTemperature
        version: 1
      - id: dreamspace09858.moesTempCalibration
        version: 1
      - id: dreamspace09858.moesDeadzone
        version: 1
      - id: dreamspace09858.moesSensorMode
        version: 1
      - id: dreamspace09858.moesChildLock
        version: 1
      - id: dreamspace09858.moesDisplayBrightness
        version: 1
      - id: dreamspace09858.moesScreenTimeout
        version: 1
      - id: dreamspace09858.moesBacklight
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Thermostat
metadata:
  deviceType: Thermostat
  ocfDeviceType: oic.d.thermostat
  deviceTypeId: Thermostat
